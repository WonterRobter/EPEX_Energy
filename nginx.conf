events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # De brug naar Node-RED
        location /api/ {
            proxy_pass http://192.168.1.145:1880/api/; 
        }
    }
}