services:
  nodered:
    image: nodered/node-red:latest-debian
    container_name: epex_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    env_file:
      - .env
    volumes:
      - ./nodered_data:/data
      - ./database:/database
    environment:
      - TZ=Europe/Brussels
      - NODE_RED_CONTEXT_STORAGE_DEFAULT=file

  webserver:
    image: nginx:alpine
    container_name: epex_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  mariadb:
    image: mariadb:lts
    container_name: epex_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: WannesDL2009!
      MYSQL_DATABASE: energie_db
      MYSQL_USER: epex_user
      MYSQL_PASSWORD: WannesDL2009!
      MARIADB_AUTO_UPGRADE: 1
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: epex_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=epex_mariadb
      - PMA_ARBITRARY=1

  influxdb:
    image: influxdb:2.7
    container_name: epex_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb2_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=epex_admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=WannesDL2009!
      - DOCKER_INFLUXDB_INIT_ORG=epex_org
      - DOCKER_INFLUXDB_INIT_BUCKET=energie_db
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=epex_super_secret_token_2026