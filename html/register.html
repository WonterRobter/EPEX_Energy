<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren - EPEXenergy</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css?v=101">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="pics/icon-192.png">
    <meta name="theme-color" content="#3c91e6">
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: var(--grey); font-family: var(--poppins);
        }
        .login-box {
            background: var(--light); padding: 40px; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); width: 100%; max-width: 400px; text-align: center;
        }
        .login-box .logo { font-size: 50px; color: var(--blue); margin-bottom: 10px; }
        .login-box h2 { color: var(--dark); margin-bottom: 30px; font-weight: 600; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--dark-grey); font-size: 20px;
        }
        .input-group input {
            width: 100%; padding: 15px 15px 15px 45px; border: 2px solid transparent;
            border-radius: 30px; background: var(--grey); color: var(--dark);
            outline: none; font-size: 15px; transition: all 0.3s ease;
        }
        .input-group input:focus { border-color: var(--blue); }
        .btn-login {
            width: 100%; padding: 15px; background: var(--blue); color: #fff;
            border: none; border-radius: 30px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s ease; margin-top: 10px;
        }
        .btn-login:hover { background: #2b7fc7; }
        
        #error-msg {
            color: #DB504A; margin-top: 15px; font-size: 14px; font-weight: 500; display: none;
        }
        .register-link {
            margin-top: 25px; font-size: 14px; color: var(--dark-grey);
        }
        .register-link a {
            color: var(--blue); font-weight: 600; text-decoration: none;
        }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body class="dark">

    <div class="login-box">
        <i class='bx bxs-user-plus logo'></i>
        <h2>Account Aanmaken</h2>
        
        <form id="registerForm">
            <div class="input-group">
                <i class='bx bxs-user'></i>
                <input type="text" id="username" placeholder="Kies een gebruikersnaam" required>
            </div>
            
            <div class="input-group">
                <i class='bx bxs-envelope'></i>
                <input type="email" id="email" placeholder="Jouw e-mailadres" required>
            </div>
            
            <div class="input-group">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" id="password" placeholder="Kies een wachtwoord" required>
            </div>

            <div class="input-group">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" id="password_confirm" placeholder="Bevestig wachtwoord" required>
            </div>
            
            <button type="submit" class="btn-login">Registreren</button>
            
            <p id="error-msg"></p>
        </form>

        <div class="register-link">
            Al een account? <a href="login.html">Log hier in</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const user = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const passConfirm = document.getElementById('password_confirm').value;
            const btn = document.querySelector('.btn-login');
            const errorMsg = document.getElementById('error-msg');
            
            // Check of wachtwoorden matchen
            if (pass !== passConfirm) {
                errorMsg.innerText = "Wachtwoorden komen niet overeen!";
                errorMsg.style.display = "block";
                return;
            }

            btn.innerText = "Bezig met registreren...";
            errorMsg.style.display = "none";
            
            try {
                // We gebruiken direct het Node-RED poortnummer net als bij login
                const response = await fetch('http://192.168.1.130:1880/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, email: email, password: pass })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    btn.innerText = "Account aangemaakt!";
                    btn.style.background = "#28a745"; 
                    // Stuur direct door naar inloggen
                    setTimeout(() => { window.location.href = "login.html"; }, 1500);
                } else {
                    errorMsg.innerText = result.error || "Fout bij het registreren.";
                    errorMsg.style.display = "block";
                    btn.innerText = "Registreren";
                }
            } catch (error) {
                console.error(error);
                errorMsg.innerText = "Kan geen verbinding maken met de server.";
                errorMsg.style.display = "block";
                btn.innerText = "Registreren";
            }
        });
    </script>
</body>
</html>
